<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}} · v26</title>
  <meta name="guochao-build" content="v26-shopping-cart-20261122">
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4da;color:#23384d;font-family:system-ui,"PingFang SC",sans-serif}
    body{display:grid;grid-template-rows:minmax(0,1fr) 28px;place-items:center}#game{position:relative;width:min(100vw,calc(177.7778vh - 49.7778px));height:min(calc(100vh - 28px),56.25vw);background:#f6f0e3;box-shadow:0 0 80px #0006}
    canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at 35% 30%,#f6f0e3,#e9e4da);transition:opacity .3s}
    .eyebrow{letter-spacing:.4em;font-size:13px;color:#65707a;margin:0 0 20px}h1{font-size:clamp(26px,4vw,58px);letter-spacing:.12em;margin:0 0 12px}.subtitle{color:#65707a;margin:0 0 42px;font-size:16px}.track{width:min(320px,64%);height:5px;background:#23384d22;border-radius:5px;overflow:hidden}#fill{height:100%;width:0;background:#c8943d;transition:width .2s}#status{font-size:13px;color:#65707a;margin-top:18px}#error{display:none;position:absolute;inset:15%;margin:auto;height:max-content;background:#f6f0e3;color:#23384d;border-radius:18px;padding:28px;line-height:1.6}#error button{margin-top:14px;padding:10px 20px;border:0;border-radius:8px;background:#b94732;color:#f6f0e3;font-size:16px;cursor:pointer}
    #source-link{justify-self:end;margin-right:12px;display:flex;align-items:center;gap:6px;padding:2px 6px;color:#23384d;text-decoration:none;font-size:13px;line-height:20px}#source-link:hover{color:#a43f2e;text-decoration:underline}#source-link:focus-visible{outline:3px solid #c8943d;outline-offset:1px}#source-link svg{width:18px;height:18px;fill:currentColor}@media(max-height:540px){#source-link span{display:none}}
  </style>
</head>
<body>
  <main id="game" aria-label="摆摊模拟器">
    <canvas id="unity-canvas" tabindex="0" aria-label="游戏画面，使用 WASD 移动，E 交互，Esc 暂停"></canvas>
    <div id="loading" role="status"><p class="eyebrow">摆摊模拟器 · 国潮来袭</p><h1>清晨出摊</h1><p class="subtitle">带上家当，准备今天的生意。</p><p style="font-size:12px;color:#8a9099;margin:0 0 16px">采购与装车优化 · v26</p><div class="track"><div id="fill"></div></div><p id="status">正在装载街坊与家当…</p></div>
    <div id="error" role="alert"><strong>游戏未能打开</strong><p id="error-message"></p><button onclick="location.reload()">重新打开</button></div>
  </main>
  <a id="source-link" href="https://github.com/KevinYoung-Kw/guochao-stall-simulator" target="_blank" rel="noopener noreferrer" title="在 GitHub 查看游戏源代码" aria-label="在 GitHub 查看游戏源代码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.562.104.769-.244.769-.542 0-.268-.01-.978-.015-1.92-3.13.68-3.79-1.51-3.79-1.51-.512-1.3-1.25-1.646-1.25-1.646-1.023-.7.078-.685.078-.685 1.131.08 1.726 1.16 1.726 1.16 1.006 1.725 2.64 1.227 3.283.938.102-.729.394-1.227.716-1.509-2.498-.284-5.124-1.25-5.124-5.566 0-1.23.44-2.234 1.16-3.021-.116-.285-.503-1.43.11-2.979 0 0 .945-.302 3.095 1.153a10.79 10.79 0 0 1 5.634 0c2.15-1.455 3.093-1.153 3.093-1.153.615 1.549.228 2.694.112 2.979.722.787 1.158 1.792 1.158 3.021 0 4.327-2.63 5.279-5.136 5.558.404.349.765 1.04.765 2.096 0 1.514-.014 2.736-.014 3.107 0 .3.203.651.774.541A11.251 11.251 0 0 0 12 .75Z"/></svg><span>源代码</span></a>
  <script>
    const canvas=document.getElementById('unity-canvas');
    function fail(message){console.error(message);document.getElementById('error-message').textContent='游戏载入中断，请重新打开。';document.getElementById('error').style.display='block';}
    const config={
      dataUrl:'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl:'Build/{{{ CODE_FILENAME }}}',
#endif
      streamingAssetsUrl:'StreamingAssets',
      companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
      productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio:Math.min(Math.max(window.devicePixelRatio||1,1.5),2),
      showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}
    };
    const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onerror=()=>fail('街坊和家当还没装载好，点一下重新进入。');
    script.onload=()=>createUnityInstance(canvas,config,progress=>{document.getElementById('fill').style.width=(100*progress)+'%';document.getElementById('status').textContent='正在装载街坊与家当… '+Math.round(100*progress)+'%';}).then(instance=>{window.gameInstance=instance;document.getElementById('loading').remove();canvas.focus();}).catch(fail);
    document.body.appendChild(script);
    canvas.addEventListener('pointerdown',()=>canvas.focus());
  </script>
</body>
</html>
